services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: d365opps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - postgres
    environment:
      D365_OPPS_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/d365opps
      D365_OPPS_DEMO_MODE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./var:/app/var

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      D365_OPPS_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    depends_on:
      - api
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
